# Lints the GUI with the project's .pylintrc on Windows (Deckhand is Windows-only) for every supported Python.
name: Pylint

on:
  push:
  pull_request:

jobs:
  pylint:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r frontend/requirements.txt pylint==4.0.9

      - name: Lint app code
        run: python -m pylint frontend --ignore=tests

      # Tests legitimately poke private helpers, match library call signatures and hold temp dirs open in setUp.
      - name: Lint tests
        run: python -m pylint frontend/tests --disable=protected-access,unused-argument,consider-using-with
