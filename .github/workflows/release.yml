# Builds, tests and packages Deckhand; a pushed tag like v2.0.0 publishes a GitHub Release with the zip + SHA256.txt.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  ZIG_VERSION: 0.14.1
  ZIG_SHA256: 554f5378228923ffd558eac35e21af020c73789d87afeabf4bfd16f2e6feed2c

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install Zig ${{ env.ZIG_VERSION }}
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'zig.zip'
          Invoke-WebRequest "https://ziglang.org/download/$env:ZIG_VERSION/zig-x86_64-windows-$env:ZIG_VERSION.zip" -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:ZIG_SHA256) { throw "Zig download checksum mismatch: $hash" }
          Expand-Archive $zip -DestinationPath $env:RUNNER_TEMP
          Add-Content $env:GITHUB_PATH (Join-Path $env:RUNNER_TEMP "zig-x86_64-windows-$env:ZIG_VERSION")

      - name: Resolve version (tag must match APP_VERSION)
        id: ver
        shell: pwsh
        run: |
          $app = (Select-String -Path frontend/app_paths.py -Pattern '^APP_VERSION = "(.+)"').Matches[0].Groups[1].Value
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $tag = $env:GITHUB_REF_NAME.TrimStart('v')
            if ($tag -ne $app) { throw "Tag v$tag does not match APP_VERSION $app in frontend/app_paths.py" }
          }
          "version=$app" >> $env:GITHUB_OUTPUT

      # Windows PowerShell 5.1 on purpose: it is what players run start.bat with.
      - name: Fetch speech model + Vosk runtime
        shell: powershell
        run: .\scripts\fetch_models.ps1

      - name: Engine tests
        run: zig build test --summary all

      - name: GUI tests
        working-directory: frontend
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests

      - name: Package
        shell: powershell
        run: .\scripts\package.ps1 -Version ${{ steps.ver.outputs.version }}

      - name: Checksum
        shell: pwsh
        run: |
          $name = "Deckhand-v${{ steps.ver.outputs.version }}.zip"
          $hash = (Get-FileHash "release/$name" -Algorithm SHA256).Hash.ToLower()
          Set-Content release/SHA256.txt "$hash  $name"
          Get-Content release/SHA256.txt

      - name: Upload build (manual runs)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: Deckhand-v${{ steps.ver.outputs.version }}
          path: |
            release/Deckhand-v*.zip
            release/SHA256.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          name: Deckhand v${{ steps.ver.outputs.version }}
          body_path: .github/RELEASE_NOTES.md
          files: |
            release/Deckhand-v${{ steps.ver.outputs.version }}.zip
            release/SHA256.txt
          fail_on_unmatched_files: true
